<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Assignment #4 - Forms and Validation</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>Assignment #4 - Forms and Validation</h1>

    <section>
        <h2>Simple Contact Form</h2>

        <form>
            <div>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name">
            </div>

            <div>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email">
            </div>

            <div>
                <label for="message">Message:</label>
                <textarea id="message" name="message"></textarea>
            </div>

            <button type="submit">Submit</button>
        </form>
    </section>

    <section>
        <h2>HTML5 Validation</h2>

        <form>
            <label for="name2">Name:</label>
            <input
                type="text"
                id="name2"
                name="name"
                required
                maxlength="30"
            >

            <label for="email2">Email:</label>
            <input
                type="email"
                id="email2"
                name="email"
                required
            >

            <label for="message2">Message:</label>
            <textarea
                id="message2"
                name="message"
                required
                maxlength="200"
            ></textarea>

            <button type="submit">Submit</button>
        </form>
    </section>

    <section>
        <h2>Bootstrap Form</h2>

        <form>
            <div class="row">

                <div class="col-md-6 mb-3">
                    <label for="name3" class="form-label">Name</label>
                    <input
                        type="text"
                        class="form-control"
                        id="name3"
                        placeholder="Enter your name"
                    >
                </div>

                <div class="col-md-6 mb-3">
                    <label for="email3" class="form-label">Email</label>
                    <input
                        type="email"
                        class="form-control"
                        id="email3"
                        placeholder="Enter your email"
                    >
                </div>

                <div class="col-12 mb-3">
                    <label for="message3" class="form-label">Message</label>
                    <textarea
                        class="form-control"
                        id="message3"
                        placeholder="Write your message"
                    ></textarea>

                    <div class="form-text">
                        Please write your message here.
                    </div>
                </div>

            </div>

            <button type="submit" class="btn btn-primary">
                Submit
            </button>
        </form>
    </section>

    <section>
        <h2>Bootstrap Validation</h2>

        <form>

            <div class="mb-3">
                <label for="validName" class="form-label">Name</label>

                <input
                    type="text"
                    class="form-control is-valid"
                    id="validName"
                    value="Yerkezhan"
                >

                <div class="valid-feedback">
                    Looks good!
                </div>
            </div>


            <div class="mb-3">
                <label for="invalidEmail" class="form-label">Email</label>

                <input
                    type="email"
                    class="form-control is-invalid"
                    id="invalidEmail"
                >

                <div class="invalid-feedback">
                    Email is required.
                </div>
            </div>


            <button type="submit" class="btn btn-primary">
                Submit
            </button>

        </form>
    </section>

    <section>
        <h2>Registration Form</h2>

        <form>

            <div class="row">

                <div class="col-md-6 mb-3">
                    <label for="firstName" class="form-label">
                        First Name
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="firstName"
                        required
                    >
                </div>


                <div class="col-md-6 mb-3">
                    <label for="lastName" class="form-label">
                        Last Name
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="lastName"
                        required
                    >
                </div>


                <div class="col-12 mb-3">
                    <label for="email4" class="form-label">
                        Email
                    </label>

                    <input
                        type="email"
                        class="form-control"
                        id="email4"
                        required
                    >
                </div>


                <div class="col-md-6 mb-3">
                    <label for="password" class="form-label">
                        Password
                    </label>

                    <input
                        type="password"
                        class="form-control"
                        id="password"
                        minlength="6"
                        required
                    >
                </div>


                <div class="col-md-6 mb-3">
                    <label for="confirmPassword" class="form-label">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        class="form-control"
                        id="confirmPassword"
                        minlength="6"
                        required
                    >
                </div>


                <div class="col-12 mb-3">
                    <label class="form-label">Gender</label>

                    <div class="options">
                        <div>
                            <input
                                type="radio"
                                name="gender"
                                id="male"
                                value="male"
                                required
                            >
                            <label for="male">Male</label>
                        </div>

                        <div>
                            <input
                                type="radio"
                                name="gender"
                                id="female"
                                value="female"
                            >
                            <label for="female">Female</label>
                        </div>
                    </div>
                </div>


                <div class="col-12 mb-3">
                    <label class="form-label">Hobbies</label>

                    <div class="options">
                        <div>
                            <input
                                type="checkbox"
                                id="music"
                                name="hobby"
                                value="music"
                            >
                            <label for="music">Music</label>
                        </div>

                        <div>
                            <input
                                type="checkbox"
                                id="sport"
                                name="hobby"
                                value="sport"
                            >
                            <label for="sport">Sport</label>
                        </div>

                        <div>
                            <input
                                type="checkbox"
                                id="reading"
                                name="hobby"
                                value="reading"
                            >
                            <label for="reading">Reading</label>
                        </div>
                    </div>
                </div>


                <div class="col-md-6 mb-3">
                    <label for="country" class="form-label">
                        Country
                    </label>

                    <select
                        class="form-select"
                        id="country"
                        required
                    >
                        <option value="">Choose country</option>
                        <option value="kazakhstan">Kazakhstan</option>
                        <option value="usa">USA</option>
                        <option value="uk">United Kingdom</option>
                        <option value="canada">Canada</option>
                    </select>
                </div>


                <div class="col-12">

                    <button
                        type="submit"
                        class="btn btn-success"
                    >
                        Submit
                    </button>

                    <button
                        type="reset"
                        class="btn btn-secondary"
                    >
                        Reset
                    </button>

                </div>

            </div>

        </form>
    </section>

</div>

</body>
</html>
